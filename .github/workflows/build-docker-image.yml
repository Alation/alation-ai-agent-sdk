# This GitHub Action workflow manually builds a Docker image and pushes it to the GitHub Container Registry (GHCR).
#
# To run this workflow:
# 1. Go to the "Actions" tab in your GitHub repository.
# 2. Select "Manual Docker Image Publisher" from the list of workflows.
# 3. Click "Run workflow".
# 4. Enter the desired version tag (e.g., v1.2.3) in the "Tag" input field.
# 5. The action will build the Docker image and push it to GHCR with two tags: the one you provided and 'latest'.

name: MCP Server Docker Image Build & Publisher

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'The Docker tag for the release (e.g., v1.0.0)'
        required: true
        type: string

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # Required to push images to GHCR

    steps:
      - name: Check out the repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        with:
          images: ghcr.io/alation/alation-ai-agent-sdk/alation-mcp-server
          tags: |
            # Tag with the version provided in the manual input
            type=raw,value=${{ github.event.inputs.tag }}
            # Also tag as 'latest'
            type=raw,value=latest

      - name: Build and push Docker image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: ./python/dist-mcp
          # This is a manual workflow, so we always push the image.
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ github.event.inputs.tag }}

